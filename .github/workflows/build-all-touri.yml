name: Build Star POS (Android APK & Windows Setup)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Install Capacitor
        run: |
          mkdir -p dist
          cp src/index.html dist/index.html
          [ -f src/manifest.webmanifest ] && cp src/manifest.webmanifest dist/manifest.webmanifest || true
          [ -f src/sw.js ] && cp src/sw.js dist/sw.js || true
          [ -f assets/icon-only.png ] && cp assets/icon-only.png dist/icon-only.png || true
          cp -r assets/*.png dist/ 2>/dev/null || true
          cp -r src/*.json dist/ 2>/dev/null || true

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/app@6 @capacitor/share@6
          npm install --save-dev javascript-obfuscator@4

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.starpos.app",
            "appName": "Star POS",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Obfuscate Client JavaScript (dist copy only)
        run: |
          cat << 'EOF' > obfuscate.js
          const fs = require('fs');
          const JavaScriptObfuscator = require('javascript-obfuscator');

          const file = 'dist/index.html';
          let html = fs.readFileSync(file, 'utf8');

          html = html.replace(/(<script(?: type="text\/starmain" id="starMain")?>)([\s\S]*?)<\/script>/g, function(match, open, code) {
            if (!code || !code.trim()) return match;
            const result = JavaScriptObfuscator.obfuscate(code, {
              compact: true,
              controlFlowFlattening: true,
              controlFlowFlatteningThreshold: 0.75,
              deadCodeInjection: true,
              deadCodeInjectionThreshold: 0.3,
              identifierNamesGenerator: 'hexadecimal',
              renameGlobals: false,
              selfDefending: true,
              stringArray: true,
              stringArrayEncoding: ['base64'],
              stringArrayThreshold: 0.8,
              splitStrings: true,
              splitStringsChunkLength: 8,
              transformObjectKeys: true,
              numbersToExpressions: true,
              disableConsoleOutput: true
            }).getObfuscatedCode();
            return open + result + '</script>';
          });

          fs.writeFileSync(file, html);
          console.log('Obfuscation done: ' + file);
          EOF
          node obfuscate.js

      - name: Add Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          sed -i -E 's|<string name="app_name">.*</string>|<string name="app_name">Star POS</string>|g' android/app/src/main/res/values/strings.xml || true
          sed -i -E 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">Star POS</string>|g' android/app/src/main/res/values/strings.xml || true

      - name: Add Native Print & Device-ID Plugins
        run: |
          JAVA_DIR=android/app/src/main/java/com/starpos/app
          mkdir -p "$JAVA_DIR"

          cat << 'EOF' > "$JAVA_DIR/DeviceIdPlugin.java"
          package com.starpos.app;

          import android.provider.Settings;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "DeviceId")
          public class DeviceIdPlugin extends Plugin {
              @PluginMethod
              public void getId(PluginCall call) {
                  try {
                      String id = Settings.Secure.getString(
                          getContext().getContentResolver(),
                          Settings.Secure.ANDROID_ID
                      );
                      JSObject ret = new JSObject();
                      ret.put("id", id == null ? "" : id);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("DeviceId failed: " + e.getMessage());
                  }
              }
          }
          EOF

          cat << 'EOF' > "$JAVA_DIR/PrinterPlugin.java"
          package com.starpos.app;

          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Printer")
          public class PrinterPlugin extends Plugin {
              private WebView printView;

              @PluginMethod
              public void print(final PluginCall call) {
                  final String html = call.getString("content", "");
                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              printView = new WebView(getActivity());
                              printView.setWebViewClient(new WebViewClient() {
                                  @Override
                                  public void onPageFinished(WebView view, String url) {
                                      PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                                      String job = "Star POS Invoice";
                                      pm.print(job, view.createPrintDocumentAdapter(job), new PrintAttributes.Builder().build());
                                      call.resolve();
                                  }
                              });
                              printView.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
                          } catch (Exception e) {
                              call.reject("Print failed: " + e.getMessage());
                          }
                      }
                  });
              }
          }
          EOF

          cat << 'EOF' > "$JAVA_DIR/MainActivity.java"
          package com.starpos.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PrinterPlugin.class);
                  registerPlugin(DeviceIdPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Set App Icon From assets/icon-only.png
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          if [ -f assets/icon-only.png ]; then
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              dir="android/app/src/main/res/mipmap-$density"
              if [ -d "$dir" ]; then
                cp assets/icon-only.png "$dir/ic_launcher.png" || true
                cp assets/icon-only.png "$dir/ic_launcher_round.png" || true
                cp assets/icon-only.png "$dir/ic_launcher_foreground.png" || true
              fi
            done
          fi

      - name: Configure Manifest & Build Release APK
        run: |
          RUN_NUM=$(( ${{ github.run_number }} + 21 ))
          VER_CODE=$(( RUN_NUM + 100 ))
          MAJOR=$(( (RUN_NUM - 1) / 10 + 1 ))
          MINOR=$(( (RUN_NUM - 1) % 10 ))
          VER_NAME="${MAJOR}.${MINOR}.0"
          echo "APP_VER=v${MAJOR}.${MINOR}" >> "$GITHUB_ENV"

          sed -i -E "s/versionCode\s+[0-9]+/versionCode $VER_CODE/g" android/app/build.gradle || true
          sed -i -E "s/versionName\s+\"[^\"]+\"/versionName \"$VER_NAME\"/g" android/app/build.gradle || true
          sed -i 's/android:debuggable="true"/android:debuggable="false"/g' android/app/src/main/AndroidManifest.xml || true

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK with Consistent Keystore
        env:
          STAR_KS_B64: ${{ secrets.STAR_KS_B64 }}
          STAR_KS_PASS: ${{ secrets.STAR_KS_PASS }}
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          fi

          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" StarPOS-Aligned.apk

          if [ -n "${STAR_KS_B64}" ]; then
            echo "${STAR_KS_B64}" | base64 -d > starphone_consistent.jks
          else
            echo "" | base64 -d > starphone_consistent.jks
          fi

          $BUILD_TOOLS_DIR/apksigner sign --ks starphone_consistent.jks --ks-key-alias starphone --ks-pass pass:"${STAR_KS_PASS:-StarPhone2026}" --key-pass pass:"${STAR_KS_PASS:-StarPhone2026}" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out StarPOS-Release.apk StarPOS-Aligned.apk
          $BUILD_TOOLS_DIR/apksigner verify -v StarPOS-Release.apk

      - name: Upload Android Build Output
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: StarPOS-Release.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Setup (.exe) with Tauri
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Web Assets & Obfuscate Client Code
        shell: bash
        run: |
          mkdir -p dist
          cp src/index.html dist/index.html
          [ -f src/manifest.webmanifest ] && cp src/manifest.webmanifest dist/manifest.webmanifest || true
          [ -f src/sw.js ] && cp src/sw.js dist/sw.js || true
          [ -f assets/icon-only.png ] && cp assets/icon-only.png dist/icon-only.png || true
          cp -r assets/*.png dist/ 2>/dev/null || true

          npm init -y
          npm install --save-dev @tauri-apps/cli@2 javascript-obfuscator@4

          cat << 'EOF' > obfuscate.js
          const fs = require('fs');
          const JavaScriptObfuscator = require('javascript-obfuscator');

          const opts = {
            compact: true,
            controlFlowFlattening: true,
            controlFlowFlatteningThreshold: 0.75,
            deadCodeInjection: true,
            deadCodeInjectionThreshold: 0.3,
            identifierNamesGenerator: 'hexadecimal',
            renameGlobals: false,
            selfDefending: true,
            stringArray: true,
            stringArrayEncoding: ['base64'],
            stringArrayThreshold: 0.8,
            splitStrings: true,
            splitStringsChunkLength: 8,
            transformObjectKeys: true,
            numbersToExpressions: true,
            disableConsoleOutput: true
          };

          const htmlFile = 'dist/index.html';
          let html = fs.readFileSync(htmlFile, 'utf8');
          html = html.replace(/(<script(?: type="text\/starmain" id="starMain")?>)([\s\S]*?)<\/script>/g, function(match, open, code) {
            if (!code || !code.trim()) return match;
            const result = JavaScriptObfuscator.obfuscate(code, opts).getObfuscatedCode();
            return open + result + '</script>';
          });
          fs.writeFileSync(htmlFile, html);
          console.log('Obfuscation completed for dist/index.html');
          EOF
          node obfuscate.js

      - name: Configure Tauri v2 Project (Rust + MachineGuid + Version + Icons)
        shell: bash
        run: |
          RUN_NUM=$(( ${{ github.run_number }} + 21 ))
          MAJOR=$(( (RUN_NUM - 1) / 10 + 1 ))
          MINOR=$(( (RUN_NUM - 1) % 10 ))
          VER="${MAJOR}.${MINOR}.0"
          echo "APP_VER=v${MAJOR}.${MINOR}" >> "$GITHUB_ENV"
          echo "PKG_VER=${VER}" >> "$GITHUB_ENV"

          mkdir -p src-tauri/src src-tauri/capabilities src-tauri/icons

          cat << EOF > src-tauri/Cargo.toml
          [package]
          name = "star-pos"
          version = "${VER}"
          description = "Star POS"
          authors = ["Hasan E Sulaiman"]
          edition = "2021"

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"

          [profile.release]
          panic = "abort"
          codegen-units = 1
          lto = true
          opt-level = "s"
          strip = true
          EOF

          cat << 'EOF' > src-tauri/build.rs
          fn main() {
              tauri_build::build()
          }
          EOF

          cat << 'EOF' > src-tauri/src/main.rs
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

          #[tauri::command]
          fn get_machine_guid() -> String {
              #[cfg(target_os = "windows")]
              {
                  use std::os::windows::process::CommandExt;
                  const CREATE_NO_WINDOW: u32 = 0x08000000;
                  if let Ok(output) = std::process::Command::new("reg")
                      .args(["query", r"HKLM\SOFTWARE\Microsoft\Cryptography", "/v", "MachineGuid"])
                      .creation_flags(CREATE_NO_WINDOW)
                      .output()
                  {
                      let stdout = String::from_utf8_lossy(&output.stdout);
                      for line in stdout.lines() {
                          if line.contains("MachineGuid") {
                              if let Some(val) = line.split_whitespace().last() {
                                  return val.trim().to_string();
                              }
                          }
                      }
                  }
              }
              String::new()
          }

          #[tauri::command]
          fn get_app_version(app: tauri::AppHandle) -> String {
              app.package_info().version.to_string()
          }

          fn main() {
              tauri::Builder::default()
                  .invoke_handler(tauri::generate_handler![get_machine_guid, get_app_version])
                  .run(tauri::generate_context!())
                  .expect("error while running tauri application");
          }
          EOF

          cat << 'EOF' > src-tauri/capabilities/default.json
          {
            "$schema": "../gen/schemas/desktop-schema.json",
            "identifier": "default",
            "description": "Default capabilities for Star POS",
            "windows": ["main"],
            "permissions": [
              "core:default"
            ]
          }
          EOF

          cat << EOF > src-tauri/tauri.conf.json
          {
            "\$schema": "https://schema.tauri.app/config/2",
            "productName": "Star POS",
            "version": "${VER}",
            "identifier": "com.starpos.app",
            "build": {
              "frontendDist": "../dist"
            },
            "app": {
              "withGlobalTauri": true,
              "windows": [
                {
                  "label": "main",
                  "title": "Star POS",
                  "width": 1200,
                  "height": 800,
                  "minWidth": 900,
                  "minHeight": 600,
                  "resizable": true,
                  "fullscreen": false
                }
              ],
              "security": {
                "csp": null
              }
            },
            "bundle": {
              "active": true,
              "targets": ["nsis"],
              "icon": [
                "icons/32x32.png",
                "icons/128x128.png",
                "icons/128x128@2x.png",
                "icons/icon.ico"
              ],
              "windows": {
                "nsis": {
                  "installMode": "currentUser"
                }
              }
            }
          }
          EOF

          if [ -f assets/icon-only.png ]; then
            npx tauri icon assets/icon-only.png
          fi
          if [ -f assets/icon.ico ]; then
            cp assets/icon.ico src-tauri/icons/icon.ico
          fi

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Compile Windows Setup (.EXE) with Tauri
        shell: bash
        run: |
          npx tauri build --bundles nsis
          mkdir -p release
          SETUP_EXE=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe" | head -n 1)
          cp "$SETUP_EXE" "release/StarPOS-Setup-${PKG_VER}.exe"
          cp src-tauri/target/release/star-pos.exe "release/StarPOS-Portable-${PKG_VER}.exe"
          ls -lh release/

      - name: Upload Windows Build Output
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: release/*.exe
          if-no-files-found: error

  release:
    name: Publish Single Release (all installers together)
    needs: [build-android, build-windows]
    if: ${{ always() && !cancelled() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute Version
        run: |
          RUN_NUM=$(( ${{ github.run_number }} + 21 ))
          MAJOR=$(( (RUN_NUM - 1) / 10 + 1 ))
          MINOR=$(( (RUN_NUM - 1) % 10 ))
          echo "APP_VER=v${MAJOR}.${MINOR}" >> "$GITHUB_ENV"

      - name: Download Build Outputs
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: out

      - name: Publish All Files In One Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VER }}
          name: Star POS (${{ env.APP_VER }})
          draft: false
          prerelease: false
          files: out/*
