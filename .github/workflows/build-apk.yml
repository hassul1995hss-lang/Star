name: Build & Sign Production Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android Build Tools
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets & Capacitor Project
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          
          # إعداد ملف التكوين capacitor.config.json بمعرف رسمي ومحدد
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.starphone.pos",
            "appName": "Star Phone POS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          
          npx cap add android
          npx cap sync android

      - name: Configure Production Android Manifest & Gradle
        run: |
          # التأكد من إزالة وضع تصحيح الأخطاء debuggable وإعداد إعدادات الأمان
          sed -i 's/android:debuggable="true"/android:debuggable="false"/g' android/app/src/main/AndroidManifest.xml || true
          
          # بناء نسخة الإصدار الرسمية Release APK
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align & Sign APK with Production Keystore (v1, v2, v3 Schemes)
        run: |
          # العثور على حزمة أدوات البناء الرسمية
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          
          # إنشاء مفتاح توقيع إنتاجي ثابت ورسمي (بدون صفة Debug) صالح لمدة 50 سنة
          keytool -genkeypair -v \
            -keystore starphone-release.jks \
            -alias starphone_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 18250 \
            -storepass "StarPhone@Secure2026" \
            -keypass "StarPhone@Secure2026" \
            -dname "CN=Star Phone Systems, OU=Mobile Solutions, O=StarPhone POS, L=Tripoli, ST=North, C=LB"
          
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          # 1. تطبيق المحاذاة الدقيقة 4-Byte ZipAlign
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" StarPhone-Aligned.apk
          
          # 2. التوقيع الرقمي المتزامن بجميع بروتوكولات أندرويد (v1 + v2 + v3)
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks starphone-release.jks \
            --ks-key-alias starphone_key \
            --ks-pass pass:"StarPhone@Secure2026" \
            --key-pass pass:"StarPhone@Secure2026" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out StarPhone-POS-Release.apk \
            StarPhone-Aligned.apk
            
          # التحقق من سلامة التوقيع
          $BUILD_TOOLS_DIR/apksigner verify -v StarPhone-POS-Release.apk

      - name: Upload Verified Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StarPhone-POS-Android-App
          path: StarPhone-POS-Release.apk
