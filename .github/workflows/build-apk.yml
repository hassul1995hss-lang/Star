name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Permanent Keystore Exists
        run: |
          # إذا لم يكن ملف المفتاح موجوداً في المستودع يتم إنشاؤه وحفظه تلقائياً
          if [ ! -f "starphone.keystore" ]; then
            keytool -genkeypair -v -keystore starphone.keystore -alias starphone -keyalg RSA -keysize 2048 -validity 10000 -storepass "StarPhone123" -keypass "StarPhone123" -dname "CN=StarPhone"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add starphone.keystore
            git commit -m "Add permanent release keystore [skip ci]" || true
            git push || true
          fi

      - name: Prepare Web Directory & Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp -f manifest.webmanifest www/ 2>/dev/null || true
          cp -f *.png www/ 2>/dev/null || true
          
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/filesystem@^6.0.0 @capacitor/app@^6.0.0
          npx cap init "Star Phone" "com.app.starphone" --web-dir "www"
          
          python3 -c '
          import json
          with open("capacitor.config.json", "r") as f:
              cfg = json.load(f)
          cfg["server"] = {
              "allowNavigation": ["*.whatsapp.com", "wa.me", "api.whatsapp.com"]
          }
          with open("capacitor.config.json", "w") as f:
              json.dump(cfg, f, indent=2)
          '
          
          npx cap add android

      - name: Apply Custom App Icon Safely
        run: |
          ICON_SRC=""
          if [ -f "icon-only.png" ]; then
            ICON_SRC="icon-only.png"
          elif [ -f "icon-192.png" ]; then
            ICON_SRC="icon-192.png"
          elif [ -f "icon.png" ]; then
            ICON_SRC="icon.png"
          fi

          if [ -n "$ICON_SRC" ]; then
            RES_DIR="android/app/src/main/res"
            rm -rf "$RES_DIR"/mipmap-anydpi-v26
            for d in "$RES_DIR"/mipmap-*; do
              if [ -d "$d" ]; then
                cp -f "$ICON_SRC" "$d/ic_launcher.png"
                cp -f "$ICON_SRC" "$d/ic_launcher_round.png"
                cp -f "$ICON_SRC" "$d/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Inject Permissions & WhatsApp Queries
        run: |
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r", encoding="utf-8") as f:
              c = f.read()
          extra = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" android:host="wa.me" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" android:host="api.whatsapp.com" />
                  </intent>
              </queries>
          </manifest>"""
          c = c.replace("</manifest>", extra)
          with open("android/app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(c)
          '

      - name: Bind Fixed Keystore & Increase Version
        run: |
          # نسخ المفتاح الثابت إلى داخل مشروع أندرويد
          cp starphone.keystore android/app/starphone.keystore
          
          # زيادة رقم الإصدار تلقائياً مع كل بناء
          BUILD_GRADLE="android/app/build.gradle"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" "$BUILD_GRADLE"
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/g" "$BUILD_GRADLE"
          
          # ربط التوقيع الرسمي الدائم
          python3 -c '
          with open("android/app/build.gradle", "r") as f:
              text = f.read()
          cfg = """
              signingConfigs {
                  debug {
                      storeFile file("starphone.keystore")
                      storePassword "StarPhone123"
                      keyAlias "starphone"
                      keyPassword "StarPhone123"
                  }
              }
          """
          text = text.replace("android {", "android {" + cfg)
          with open("android/app/build.gradle", "w") as f:
              f.write(text)
          '

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarPhone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
