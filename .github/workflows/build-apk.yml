name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Directory & Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp -f manifest.webmanifest www/ 2>/dev/null || true
          cp -f *.png www/ 2>/dev/null || true
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Star Phone" "com.app.starphone" --web-dir "www"
          npx cap add android

      - name: Inject Permissions to AndroidManifest
        run: |
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r", encoding="utf-8") as f:
              c = f.read()
          extra = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <queries>
                  <package android:name="com.whatsapp" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
          </manifest>"""
          c = c.replace("</manifest>", extra)
          with open("android/app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(c)
          '

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarPhone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
