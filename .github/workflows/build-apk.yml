name: Build & Sign Android APK (Star POS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # مفتاح التوقيع الثابت. يُفضّل وضع القيم الحقيقية في GitHub Secrets (KEYSTORE_PASSWORD) وإلا تُستخدم هذه القيم.
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || '2wMcuNqEQ3sTIWouo3t2' }}
      KS_ALIAS: star_pos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Capacitor
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-only.png dist/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/app@6
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.starphone.pos",
            "appName": "Star POS",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Set App Icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            if [ -d "$dir" ]; then
              cp icon-only.png "$dir/ic_launcher.png"
              cp icon-only.png "$dir/ic_launcher_round.png"
              cp icon-only.png "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Configure Version & Hardening
        run: |
          # versionCode يعتمد على الوقت فيزداد دائماً (شرط قبول التحديث فوق النسخة المثبتة)
          VC=$(( $(date +%s) / 60 ))
          VN="2.2.${{ github.run_number }}"
          sed -i "s/versionCode [0-9]*/versionCode $VC/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VN\"/" android/app/build.gradle
          echo "versionCode=$VC versionName=$VN"
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' $M
          sed -i 's/<application/<application android:usesCleartextTraffic="false"/' $M
          sed -i 's/android:debuggable="true"/android:debuggable="false"/' $M || true

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK with the permanent Star POS key
        run: |
          BT=$(find $ANDROID_SDK_ROOT/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BT/zipalign -p 4 "$UNSIGNED" StarPOS-Aligned.apk
          # لا يتم أبداً توليد مفتاح جديد: إن فشل التوقيع يفشل البناء بدل إنتاج APK بتوقيع مختلف
          $BT/apksigner sign --ks star-pos.keystore --ks-key-alias "$KS_ALIAS" --ks-pass pass:"$KS_PASS" --key-pass pass:"$KS_PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out StarPOS-Release.apk StarPOS-Aligned.apk
          $BT/apksigner verify --print-certs StarPOS-Release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StarPOS-Android
          path: StarPOS-Release.apk
