name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Directory & Capacitor with Plugins
        run: |
          mkdir -p www
          cp index.html www/
          cp -f manifest.webmanifest www/ 2>/dev/null || true
          cp -f *.png www/ 2>/dev/null || true
          
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/filesystem@^6.0.0 @capacitor/app@^6.0.0
          npx cap init "Star Phone" "com.app.starphone" --web-dir "www"
          
          python3 -c '
          import json
          with open("capacitor.config.json", "r") as f:
              cfg = json.load(f)
          cfg["server"] = {
              "allowNavigation": ["*.whatsapp.com", "wa.me"]
          }
          with open("capacitor.config.json", "w") as f:
              json.dump(cfg, f, indent=2)
          '
          
          npx cap add android

      - name: Apply Custom App Icon
        run: |
          # العثور على ملف الأيقونة ونسخه مكان أيقونات أندرويد الافتراضية
          ICON_SRC=""
          if [ -f "icon-only.png" ]; then
            ICON_SRC="icon-only.png"
          elif [ -f "icon-192.png" ]; then
            ICON_SRC="icon-192.png"
          elif [ -f "icon.png" ]; then
            ICON_SRC="icon.png"
          fi

          if [ -n "$ICON_SRC" ]; then
            echo "Applying custom icon: $ICON_SRC"
            RES_DIR="android/app/src/main/res"
            for d in "$RES_DIR"/mipmap-*; do
              if [ -d "$d" ]; then
                cp -f "$ICON_SRC" "$d/ic_launcher.png"
                cp -f "$ICON_SRC" "$d/ic_launcher_round.png"
                cp -f "$ICON_SRC" "$d/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Inject Permissions & WhatsApp Queries
        run: |
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r", encoding="utf-8") as f:
              c = f.read()
          extra = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <queries>
                  <package android:name="com.whatsapp" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
              </queries>
          </manifest>"""
          c = c.replace("</manifest>", extra)
          with open("android/app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(c)
          '

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarPhone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
