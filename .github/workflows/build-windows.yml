name: Build Windows Application (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Web Directory & Electron Shell
        shell: bash
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          npm init -y
          npm install --save-dev electron electron-builder javascript-obfuscator@4

          cat << 'EOF' > main.js
          const { app, BrowserWindow, ipcMain } = require('electron');
          const { exec } = require('child_process');
          const path = require('path');

          function createWindow () {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              minWidth: 900,
              minHeight: 600,
              autoHideMenuBar: true,
              title: "Star POS",
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                preload: path.join(__dirname, 'preload.js')
              }
            });

            win.loadFile('dist/index.html');
          }

          // معرّف جهاز ثابت من سجل ويندوز (MachineGuid): لا يتأثر بإعادة تثبيت البرنامج، فقط بإعادة تثبيت نظام التشغيل
          ipcMain.handle('get-machine-guid', () => {
            return new Promise((resolve) => {
              exec('reg query "HKLM\\SOFTWARE\\Microsoft\\Cryptography" /v MachineGuid', (err, stdout) => {
                if (err) return resolve('');
                const m = /MachineGuid\s+REG_SZ\s+([0-9a-fA-F-]+)/.exec(stdout);
                resolve(m ? m[1] : '');
              });
            });
          });

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

          cat << 'EOF' > preload.js
          const { contextBridge, ipcRenderer } = require('electron');
          contextBridge.exposeInMainWorld('electronAPI', {
            getMachineGuid: () => ipcRenderer.invoke('get-machine-guid')
          });
          EOF

      - name: Obfuscate Client JavaScript (dist copy only — source on GitHub stays readable)
        shell: bash
        run: |
          cat << 'EOF' > obfuscate.js
          const fs = require('fs');
          const JavaScriptObfuscator = require('javascript-obfuscator');

          const file = 'dist/index.html';
          let html = fs.readFileSync(file, 'utf8');

          html = html.replace(/<script>([\s\S]*?)<\/script>/g, function(match, code) {
            const result = JavaScriptObfuscator.obfuscate(code, {
              compact: true,
              controlFlowFlattening: true,
              controlFlowFlatteningThreshold: 0.75,
              deadCodeInjection: true,
              deadCodeInjectionThreshold: 0.3,
              identifierNamesGenerator: 'hexadecimal',
              renameGlobals: false,
              selfDefending: true,
              stringArray: true,
              stringArrayEncoding: ['base64'],
              stringArrayThreshold: 0.8,
              splitStrings: true,
              splitStringsChunkLength: 8,
              transformObjectKeys: true,
              numbersToExpressions: true,
              disableConsoleOutput: true
            }).getObfuscatedCode();
            return '<script>' + result + '</script>';
          });

          fs.writeFileSync(file, html);
          console.log('Obfuscation done: ' + file);
          EOF
          node obfuscate.js

      - name: Configure Package.json for Windows Executable
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.main = "main.js";
          const runNum = parseInt(process.env.GITHUB_RUN_NUMBER || "1");
          const major = Math.floor((runNum - 1) / 10) + 1;
          const minor = (runNum - 1) % 10;
          pkg.version = `${major}.${minor}.0`;
          pkg.scripts = {
            "dist": "electron-builder --win portable"
          };
          pkg.build = {
            "appId": "com.starpos.app",
            "productName": "Star POS",
            "directories": {
              "output": "release"
            },
            "win": {
              "target": ["portable"],
              "icon": "icon.ico"
            },
            "files": [
              "main.js",
              "preload.js",
              "dist/**/*",
              "icon.ico"
            ]
          };
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Compile Windows .EXE
        shell: bash
        run: |
          npm run dist

      - name: Upload Windows Executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.0.${{ github.run_number }}
          name: Star POS Windows (v1.0.${{ github.run_number }})
          files: release/*.exe
