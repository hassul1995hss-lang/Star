name: Build Windows App (Star POS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Electron project
        shell: bash
        run: |
          mkdir -p app
          cp index.html manifest.webmanifest icon-192.png icon-512.png icon-only.png electron-main.js app/
          cd app
          npm init -y
          npm install --save-dev electron@31 electron-builder@24
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.name = "star-pos";
          pkg.version = "2.2." + process.env.GITHUB_RUN_NUMBER;
          pkg.description = "Star POS";
          pkg.author = "Star POS";
          pkg.main = "electron-main.js";
          pkg.build = {
            appId: "com.starphone.pos",
            productName: "Star POS",
            directories: { output: "../release" },
            files: ["electron-main.js", "index.html", "manifest.webmanifest", "icon-*.png"],
            win: { target: ["nsis", "portable"], icon: "icon-512.png" },
            nsis: { oneClick: true, perMachine: false, deleteAppDataOnUninstall: false, runAfterFinish: true },
            artifactName: "StarPOS-${version}-${target}.${ext}"
          };
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Build installer and portable
        shell: bash
        working-directory: app
        run: npx electron-builder --win --publish never

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: StarPOS-Windows
          path: release/*.exe
